name: Publicar vista previa en GitHub Pages

# Versión ESTÁTICA del sitio público (sin /admin) con el contenido inicial del seed.
# Se publica en la rama gh-pages: Settings → Pages → Deploy from a branch → gh-pages / (root).
on:
  push:
    branches: [claude/hopeful-cori-ogt5iv]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Entorno temporal y contenido inicial
        run: |
          echo "PAYLOAD_SECRET=$(openssl rand -hex 32)" >> .env
          echo "DATABASE_URL=file:./data/payload.db" >> .env
          npm run seed

      - name: Exportar sitio estático
        run: ./scripts/static-export.sh
        env:
          CI: 'true'
          BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Publicar en la rama gh-pages
        working-directory: out
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
